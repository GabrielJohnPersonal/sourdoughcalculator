<body class="bg-surface text-ink antialiased selection:bg-terracotta/20 selection:text-ink">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Audio Synthesizer ---
    function playKitchenChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const playTone = (freq, start, dur) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, ctx.currentTime + start);
          gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + start + 0.04);
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + dur + 0.08);
        };
        [0, 0.38, 0.76].forEach((offset) => {
          playTone(880, offset, 0.28);
          playTone(1100, offset + 0.14, 0.22);
        });
        if ('vibrate' in navigator) {
          navigator.vibrate([280, 90, 280]);
        }
      } catch (e) {}
    }

    // --- Format Seconds to HH:MM:SS ---
    function formatTimeRemaining(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // --- Lucide Icon Helper ---
    function LucideIcon({ name, className = "w-5 h-5", strokeWidth = 2 }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className} style={{ strokeWidth }}></i>;
    }

    // --- Initial Starters & History Seeds ---
    const INITIAL_STARTERS = [
      {
        id: 'starter-1',
        name: 'Doughlene',
        flourType: '100% Dark Rye',
        hydration: 100,
        status: 'active_peak',
        lastFedText: '4h ago',
        lastRatio: '1:2:2 feed · Active & at peak',
      },
      {
        id: 'starter-2',
        name: 'Bread Pitt',
        flourType: 'Stiff Starter · AP Flour',
        hydration: 60,
        status: 'hungry',
        lastFedText: '14h ago',
        lastRatio: '1:1:1 feed · Passed peak',
      }
    ];

    const INITIAL_HISTORY = [
      {
        id: 1,
        date: 'Oct 12, 2023',
        title: 'Country Sourdough',
        rating: 4,
        hydration: 78,
        totalFlour: 1000,
        starterGrams: 200,
        starterId: 'starter-1',
        flourBlend: [
          { id: 1, name: 'Bread Flour', pct: 80 },
          { id: 2, name: 'Whole Wheat', pct: 20 },
        ],
        notes: 'Great oven spring, slightly dense crumb.'
      },
      {
        id: 2,
        date: 'Oct 05, 2023',
        title: 'Walnut Cranberry',
        rating: 5,
        hydration: 82,
        totalFlour: 800,
        starterGrams: 120,
        starterId: 'starter-1',
        flourBlend: [
          { id: 1, name: 'Bread Flour', pct: 70 },
          { id: 2, name: 'Whole Wheat', pct: 20 },
          { id: 3, name: 'Dark Rye', pct: 10 },
        ],
        notes: 'Perfect holiday loaf. Nuts toasted prior.'
      },
      {
        id: 3,
        date: 'Sep 28, 2023',
        title: 'Whole Wheat Experiment',
        rating: 2,
        hydration: 85,
        totalFlour: 900,
        starterGrams: 225,
        starterId: 'starter-2',
        flourBlend: [
          { id: 1, name: 'Whole Wheat', pct: 60 },
          { id: 2, name: 'Bread Flour', pct: 40 },
        ],
        notes: 'Overproofed. Room was too warm.'
      }
    ];

    const INITIAL_ACTIVE_BAKE = {
      id: 101,
      title: 'Country Loaf',
      stage: 'autolyse',
      loaves: 1,
      hydration: 75,
      totalFlour: 500,
      starterGrams: 100,
      starterId: 'starter-1',
      foldsCompleted: 2,
      totalFolds: 4,
      timerTargetEnd: Date.now() + 18 * 60 * 1000,
      timerDuration: 30 * 60,
      timerRunning: true,
      flourBlend: [
        { id: 1, name: 'Bread Flour', pct: 80 },
        { id: 2, name: 'Whole Wheat', pct: 20 },
      ],
      timeline: [
        { id: 't1', time: '08:00 AM', text: 'Autolyse started (30m)' },
        { id: 't2', time: '08:30 AM', text: 'Autolyse extended (+15m)' },
        { id: 't3', time: '08:45 AM', text: 'Autolyse finished' },
        { id: 't4', time: '09:15 AM', text: 'Stretch & fold 1 of 4 logged' },
        { id: 't5', time: '09:45 AM', text: 'Stretch & fold 2 of 4 logged' },
      ]
    };

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('active'); // 'active' | 'history' | 'diary'
      const [isBuildingRecipe, setIsBuildingRecipe] = useState(false);

      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('sourdough_user');
          return saved ? JSON.parse(saved) : null;
        } catch { return null; }
      });

      const [hasSeenWelcome, setHasSeenWelcome] = useState(() => {
        return localStorage.getItem('sourdough_seen_welcome') === 'true';
      });
      const [isWelcomeOpen, setIsWelcomeOpen] = useState(!hasSeenWelcome);
      const [wakeLockActive, setWakeLockActive] = useState(false);

      const [starters, setStarters] = useState(INITIAL_STARTERS);
      const [history, setHistory] = useState(INITIAL_HISTORY);
      const [activeBakes, setActiveBakes] = useState([INITIAL_ACTIVE_BAKE]);

      // ================= SECTION 1: TARGET BANNETON SIZE STATE =================
      const [loafSizePreset, setLoafSizePreset] = useState('large'); // 'small' | 'medium' | 'large' | 'custom'
      const [calcFlour, setCalcFlour] = useState(500);
      const [calcLoaves, setCalcLoaves] = useState(1);
      const [calcHydration, setCalcHydration] = useState(75);
      const [calcSalt, setCalcSalt] = useState(2.0);

      // ================= SECTION 2: STARTER INPUT STATE =================
      const [starterInputMode, setStarterInputMode] = useState('diary'); // 'diary' | 'grams' | 'manual'
      const [selectedStarterId, setSelectedStarterId] = useState('starter-1');
      const [starterTotalGrams, setStarterTotalGrams] = useState(100);
      const [manualStarterFlour, setManualStarterFlour] = useState(50);
      const [manualStarterWater, setManualStarterWater] = useState(50);

      // ================= SECTION 3: FLOUR BLEND STATE =================
      const [flourBlend, setFlourBlend] = useState([
        { id: 1, name: 'Bread Flour', pct: 80 },
        { id: 2, name: 'Whole Wheat', pct: 20 },
      ]);

      // Levain Builder State (Diary Tab)
      const [levainTarget, setLevainTarget] = useState(150);
      const [levainRatio, setLevainRatio] = useState('1:2:2');

      // Feed Modal State
      const [selectedFeedStarter, setSelectedFeedStarter] = useState(null);
      const [feedSeedGrams, setFeedSeedGrams] = useState(25);
      const [feedFlourGrams, setFeedFlourGrams] = useState(50);
      const [feedWaterGrams, setFeedWaterGrams] = useState(50);
      const [feedNotes, setFeedNotes] = useState('');

      // Live Timer Tick
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const interval = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(interval);
      }, []);

      // Banneton Preset Handler (Sets predetermined flour weight)
      const handleSelectSizePreset = (preset) => {
        setLoafSizePreset(preset);
        if (preset === 'small') setCalcFlour(300);
        else if (preset === 'medium') setCalcFlour(400);
        else if (preset === 'large') setCalcFlour(500);
      };

      const selectedStarterEntity = starters.find(s => s.id === selectedStarterId) || starters[0];

      // ================= CALCULATION ENGINE =================
      let computedStarterFlour = 0;
      let computedStarterWater = 0;
      let computedTotalStarter = 0;

      if (starterInputMode === 'diary') {
        const hyd = selectedStarterEntity ? selectedStarterEntity.hydration : 100;
        computedTotalStarter = starterTotalGrams * calcLoaves;
        computedStarterFlour = Math.round(computedTotalStarter / (1 + (hyd / 100)));
        computedStarterWater = computedTotalStarter - computedStarterFlour;
      } else if (starterInputMode === 'grams') {
        computedTotalStarter = starterTotalGrams * calcLoaves;
        computedStarterFlour = Math.round(computedTotalStarter / 2);
        computedStarterWater = computedTotalStarter - computedStarterFlour;
      } else if (starterInputMode === 'manual') {
        computedStarterFlour = manualStarterFlour * calcLoaves;
        computedStarterWater = manualStarterWater * calcLoaves;
        computedTotalStarter = computedStarterFlour + computedStarterWater;
      }

      const totalWaterGrams = Math.round((calcFlour * calcHydration) / 100) * calcLoaves;
      const totalSaltGrams = Math.round((calcFlour * calcSalt) / 100 * 10) / 10 * calcLoaves;

      const mainFlourTotal = Math.max(0, (calcFlour * calcLoaves) - computedStarterFlour);
      const mainWaterGrams = Math.max(0, totalWaterGrams - computedStarterWater);

      const totalBlendPct = flourBlend.reduce((acc, f) => acc + (Number(f.pct) || 0), 0) || 100;
      const itemizedFlourRows = flourBlend.map(f => {
        const itemPct = (Number(f.pct) || 0) / totalBlendPct;
        const grams = Math.round(mainFlourTotal * itemPct);
        const bakersPct = calcFlour > 0 ? Math.round((grams / (calcFlour * calcLoaves)) * 1000) / 10 : 0;
        return {
          id: f.id,
          name: `${f.name} (${f.pct}%)`,
          grams,
          bakersPct,
        };
      });

      const totalDoughGrams = (calcFlour * calcLoaves) + totalWaterGrams + totalSaltGrams;
      const totalDoughPct = calcFlour > 0 ? Math.round((totalDoughGrams / (calcFlour * calcLoaves)) * 1000) / 10 : 0;

      const ratioParts = useMemo(() => {
        const [rS, rF, rW] = levainRatio.split(':').map(Number);
        const totalParts = (rS || 1) + (rF || 2) + (rW || 2);
        const part = totalParts > 0 ? levainTarget / totalParts : 0;
        return {
          seed: Math.round(part * (rS || 1)),
          flour: Math.round(part * (rF || 2)),
          water: Math.round(part * (rW || 2)),
        };
      }, [levainTarget, levainRatio]);

      const handleAddFlour = () => {
        setFlourBlend(prev => [...prev, { id: Date.now(), name: 'Dark Rye', pct: 10 }]);
      };
      const handleRemoveFlour = (id) => {
        if (flourBlend.length <= 1) return;
        setFlourBlend(prev => prev.filter(f => f.id !== id));
      };
      const handleUpdateFlour = (id, field, val) => {
        setFlourBlend(prev => prev.map(f => f.id === id ? { ...f, [field]: field === 'pct' ? Number(val) || 0 : val } : f));
      };

      const handleCloneBake = (item) => {
        setCalcHydration(item.hydration);
        setCalcFlour(item.totalFlour);
        if (item.totalFlour <= 320) setLoafSizePreset('small');
        else if (item.totalFlour <= 420) setLoafSizePreset('medium');
        else if (item.totalFlour <= 520) setLoafSizePreset('large');
        else setLoafSizePreset('custom');

        if (item.starterGrams) setStarterTotalGrams(item.starterGrams);
        if (item.starterId) {
          setSelectedStarterId(item.starterId);
          setStarterInputMode('diary');
        }
        if (item.flourBlend && item.flourBlend.length > 0) {
          setFlourBlend(item.flourBlend);
        }
        setActiveTab('active');
        setIsBuildingRecipe(true);
      };

      const toggleWakeLock = async () => {
        if (!('wakeLock' in navigator)) {
          setWakeLockActive(!wakeLockActive);
          return;
        }
        try {
          if (!wakeLockActive) {
            await navigator.wakeLock.request('screen');
            setWakeLockActive(true);
          } else {
            setWakeLockActive(false);
          }
        } catch {
          setWakeLockActive(!wakeLockActive);
        }
      };

      const handleCloseWelcome = () => {
        localStorage.setItem('sourdough_seen_welcome', 'true');
        setHasSeenWelcome(true);
        setIsWelcomeOpen(false);
      };

      const handleSignIn = (email) => {
        const newUser = { id: 'u1', email: email || 'gabrieljohnpersonal@gmail.com', name: 'Gabriel' };
        setUser(newUser);
        handleCloseWelcome();
      };

      const handleOpenFeedModal = (starter) => {
        setSelectedFeedStarter(starter);
        if (starter.hydration === 60) {
          setFeedSeedGrams(50);
          setFeedFlourGrams(50);
          setFeedWaterGrams(30);
        } else {
          setFeedSeedGrams(25);
          setFeedFlourGrams(50);
          setFeedWaterGrams(50);
        }
        setFeedNotes('');
      };

      return (
        <div className="min-h-screen flex flex-col text-ink">
          {/* Top Header */}
          <header className="fixed top-0 w-full z-40 bg-surface/85 backdrop-blur-xl border-b border-border-card/50 shadow-sm">
            <div className="max-w-lg mx-auto h-16 px-5 flex items-center justify-between">
              <h1 className="font-serif text-[22px] font-semibold text-ink tracking-tight">
                {activeTab === 'active' && (isBuildingRecipe ? 'Recipe Builder' : 'Active Bakes')}
                {activeTab === 'history' && 'Bake History'}
                {activeTab === 'diary' && 'Starter Diary'}
              </h1>

              <div className="flex items-center gap-2.5">
                <button
                  onClick={toggleWakeLock}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-full border transition-all active:scale-95 ${
                    wakeLockActive
                      ? 'bg-linen border-terracotta/40 text-terracotta shadow-sm'
                      : 'bg-oat border-border-field text-muted'
                  }`}
                >
                  <LucideIcon name="lightbulb" className={`w-3.5 h-3.5 ${wakeLockActive ? 'text-terracotta' : 'text-faint'}`} />
                  <span className="font-sans text-[10px] uppercase tracking-wider font-semibold">
                    {wakeLockActive ? 'Awake' : 'Sleep'}
                  </span>
                </button>

                <button
                  onClick={() => setIsWelcomeOpen(true)}
                  className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-sm transition-transform active:scale-95 ${
                    user ? 'bg-terracotta text-white' : 'bg-ink text-onDark'
                  }`}
                >
                  {user ? (user.name ? user.name[0].toUpperCase() : 'G') : <LucideIcon name="user" className="w-4 h-4 text-onDark" />}
                </button>
              </div>
            </div>
          </header>

          {/* Main Body Content */}
          <main className="flex-1 pt-20 pb-28 px-4 max-w-lg mx-auto w-full">
            {/* ================= TAB 1: ACTIVE BAKES & RECIPE BUILDER ================= */}
            {activeTab === 'active' && (
              <div className="space-y-5 animate-fadeIn">
                {/* 1A: RECIPE BUILDER */}
                {isBuildingRecipe ? (
                  <div className="space-y-5">
                    <button
                      onClick={() => setIsBuildingRecipe(false)}
                      className="text-muted hover:text-ink font-sans text-xs font-semibold flex items-center gap-1"
                    >
                      <LucideIcon name="arrow-left" className="w-4 h-4" /> Back to Active Bakes
                    </button>

                    {/* ================= SECTION 1: TARGET BANNETON SIZE ================= */}
                    <div className="bg-card shadow-card border border-border-card rounded-[20px] p-[17px] space-y-4">
                      <div className="flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-terracotta/10 text-terracotta flex items-center justify-center font-serif text-xs font-bold">1</span>
                        <h2 className="font-serif text-[17px] font-semibold text-ink">Target Banneton Size</h2>
                      </div>

                      {/* Banneton Size Chips */}
                      <div className="grid grid-cols-4 gap-2">
                        {[
                          { id: 'small', label: 'Small', sub: '300g flour' },
                          { id: 'medium', label: 'Medium', sub: '400g flour' },
                          { id: 'large', label: 'Large', sub: '500g flour' },
                          { id: 'custom', label: 'Custom', sub: 'enter g' },
                        ].map(chip => (
                          <button
                            key={chip.id}
                            type="button"
                            onClick={() => handleSelectSizePreset(chip.id)}
                            className={`py-2 px-1 rounded-[11px] border text-center transition-all active:scale-95 flex flex-col items-center justify-center ${
                              loafSizePreset === chip.id
                                ? 'bg-linen border-terracotta text-ink font-bold shadow-sm'
                                : 'bg-oat border-border-field text-muted hover:text-ink'
                            }`}
                          >
                            <span className="font-sans text-xs">{chip.label}</span>
                            <span className="font-sans text-[9px] text-faint">{chip.sub}</span>
                          </button>
                        ))}
                      </div>

                      {/* Conditional Total Flour Field (Only visible when Custom is active) */}
                      {loafSizePreset === 'custom' && (
                        <div className="space-y-1.5 pt-1 animate-fadeIn">
                          <label className="font-sans text-[10px] text-faint uppercase font-semibold tracking-wider block">
                            Custom Total Flour (g)
                          </label>
                          <div className="relative">
                            <input
                              type="number"
                              value={calcFlour}
                              onChange={(e) => setCalcFlour(Math.max(0, Number(e.target.value) || 0))}
                              className="w-full bg-oat border border-border-field rounded-[11px] px-3 py-2 font-mono text-[17px] font-bold text-ink focus:outline-none focus:ring-2 focus:ring-terracotta/20 text-right pr-10"
                            />
                            <span className="absolute right-3 top-1/2 -translate-y-1/2 font-sans text-xs text-muted">g</span>
                          </div>
                        </div>
                      )}

                      <div className="h-px bg-border-leader/40 w-full"></div>

                      {/* Single Unified Row: Loaves, Hydration & Salt */}
                      <div className="grid grid-cols-3 gap-3 pt-1">
                        {/* Loaves */}
                        <div className="space-y-1.5">
                          <label className="font-sans text-[10px] text-faint uppercase font-semibold tracking-wider block text-center">
                            Loaves
                          </label>
                          <div className="flex items-center bg-oat border border-border-field rounded-[11px] px-1.5 py-1.5">
                            <button onClick={() => setCalcLoaves(prev => Math.max(1, prev - 1))} className="w-6 h-6 flex items-center justify-center font-bold text-muted hover:text-ink">-</button>
                            <span className="flex-1 text-center font-mono font-bold text-[16px] text-ink">{calcLoaves}</span>
                            <button onClick={() => setCalcLoaves(prev => prev + 1)} className="w-6 h-6 flex items-center justify-center font-bold text-muted hover:text-ink">+</button>
                          </div>
                        </div>

                        {/* Hydration */}
                        <div className="space-y-1.5">
                          <label className="font-sans text-[10px] text-faint uppercase font-semibold tracking-wider flex items-center justify-center gap-1">
                            <LucideIcon name="droplets" className="w-3 h-3 text-terracotta" /> Hydration
                          </label>
                          <div className="relative">
                            <input
                              type="number"
                              value={calcHydration}
                              onChange={(e) => setCalcHydration(Number(e.target.value) || 0)}
                              className="w-full bg-oat border border-border-field rounded-[11px] px-2 py-2 font-mono font-bold text-[16px] text-ink focus:outline-none text-center pr-5"
                            />
                            <span className="absolute right-2 top-1/2 -translate-y-1/2 font-mono text-xs text-muted">%</span>
                          </div>
                        </div>

                        {/* Salt */}
                        <div className="space-y-1.5">
                          <label className="font-sans text-[10px] text-faint uppercase font-semibold tracking-wider flex items-center justify-center gap-1">
                            <LucideIcon name="sparkles" className="w-3 h-3 text-terracotta" /> Salt
                          </label>
                          <div className="relative">
                            <input
                              type="number"
                              step="0.1"
                              value={calcSalt}
                              onChange={(e) => setCalcSalt(Number(e.target.value) || 0)}

                                </div>

                            <div className="flex items-baseline gap-2 text-right min-w-[85px]">

          {selectedFeedStarter && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/40 backdrop-blur-sm animate-fadeIn">
              <div className="bg-card max-w-sm w-full rounded-[20px] border border-border-card p-5 space-y-4 shadow-xl">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="font-serif italic text-xs uppercase text-terracotta">Log Feed</span>
                    <h3 className="font-serif text-lg font-semibold text-ink">{selectedFeedStarter.name}</h3>
                    <p className="font-sans text-[11px] text-muted">{selectedFeedStarter.hydration}% Hydration · {selectedFeedStarter.flourType}</p>
                  </div>
                  <button onClick={() => setSelectedFeedStarter(null)} className="text-muted hover:text-ink">
                    <LucideIcon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] text-faint uppercase font-bold font-sans">Seed (g)</label>
                      <input
                        type="number"
                        value={feedSeedGrams}
                        onChange={(e) => setFeedSeedGrams(Number(e.target.value) || 0)}
                        className="w-full bg-oat border border-border-field rounded-[11px] p-2 text-center font-mono font-bold text-xs"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-faint uppercase font-bold font-sans">Flour (g)</label>
                      <input
                        type="number"
                        value={feedFlourGrams}
                        onChange={(e) => setFeedFlourGrams(Number(e.target.value) || 0)}
                        className="w-full bg-oat border border-border-field rounded-[11px] p-2 text-center font-mono font-bold text-xs"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-faint uppercase font-bold font-sans">Water (g)</label>
                      <input
                        type="number"
                        value={feedWaterGrams}
                        onChange={(e) => setFeedWaterGrams(Number(e.target.value) || 0)}
                        className="w-full bg-oat border border-border-field rounded-[11px] p-2 text-center font-mono font-bold text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-faint uppercase font-bold font-sans">Notes / Aroma</label>
                    <input
                      type="text"
                      placeholder="e.g. Doubled in 4h, sweet yeasty aroma"
                      value={feedNotes}
                      onChange={(e) => setFeedNotes(e.target.value)}
                      className="w-full bg-oat border border-border-field rounded-[11px] p-2 text-xs font-sans"
                    />
                  </div>

                  <button
                    onClick={() => {
                      const minP = Math.min(feedSeedGrams, feedFlourGrams, feedWaterGrams) || 1;
                      const ratioStr = `${Math.round(feedSeedGrams/minP)}:${Math.round(feedFlourGrams/minP)}:${Math.round(feedWaterGrams/minP)}`;
                      setStarters(prev => prev.map(s => s.id === selectedFeedStarter.id ? {
                        ...s,
                        lastFedText: 'Just now',
                        lastRatio: ratioStr,
                        status: 'active_peak',
                      } : s));
                      setSelectedFeedStarter(null);
                      playKitchenChime();
                    }}
                    className="w-full bg-terracotta hover:bg-primary text-white py-3 rounded-[16px] font-sans font-semibold text-xs shadow-btnTerracotta active:scale-98 transition-all"
                  >
                    Save Feed & Start Rise Timer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
