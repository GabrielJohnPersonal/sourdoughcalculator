name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign & Align APK for Android 12/13/14/15
        run: |
          BUILD_TOOLS_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at $BUILD_TOOLS_PATH"
          
          keytool -genkey -v -keystore release.keystore -alias sourdough -keyalg RSA -keysize 2048 -validity 10000 -storepass sourdough123 -keypass sourdough123 -dname "CN=SourdoughCalculator, OU=App, O=Bakery, L=Kitchen, ST=App, C=US"
          
          $BUILD_TOOLS_PATH/zipalign -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk Sourdough-Calculator.apk
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-pass pass:sourdough123 --ks-key-alias sourdough --key-pass pass:sourdough123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true Sourdough-Calculator.apk
          $BUILD_TOOLS_PATH/apksigner verify Sourdough-Calculator.apk

      - name: Upload Verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sourdough-Calculator-Android-APK
          path: Sourdough-Calculator.apk
