name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign & Align APK for Android 12/13/14/15
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Locate build-tools
          BUILD_TOOLS_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at $BUILD_TOOLS_PATH"

          # Reuse the one permanent keystore (repo secret) instead of generating a
          # fresh one every run — a different signing key each build is why Android
          # used to refuse every "update" and force a full uninstall/reinstall.
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # Align and Sign with v2/v3 scheme
          $BUILD_TOOLS_PATH/zipalign -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk Sourdough-Calculator.apk
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias sourdough --key-pass "pass:$KEYSTORE_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true Sourdough-Calculator.apk
          $BUILD_TOOLS_PATH/apksigner verify Sourdough-Calculator.apk

      - name: Upload Verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sourdough-Calculator-Android-APK
          path: Sourdough-Calculator.apk
