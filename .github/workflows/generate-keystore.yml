name: Generate Android Signing Keystore (one-time)

# Run once to produce a real, permanent signing keystore — the normal build
# workflow currently generates a throwaway one on every run, which means
# Android refuses to install any build as an "update" over the last one (a
# different signing key looks like a different, untrusted app). This job
# creates ONE keystore and hands it back as a short-lived download; after
# it's copied into the two repo secrets below, this workflow isn't needed
# again unless the keystore is ever lost.
#
# After a successful run: open the run's Summary page, download the
# "android-keystore" artifact, and add its two files as repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64    <- contents of keystore.base64.txt
#   ANDROID_KEYSTORE_PASSWORD  <- contents of password.txt
# Then delete this workflow file and android-build.yml can be switched to
# consume those secrets instead of generating a fresh keystore each time.

on:
  push:
    paths:
      - '.github/workflows/generate-keystore.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore with a random password
        run: |
          PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias sourdough \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Sourdough Calculator, OU=Personal, O=Personal, L=City, ST=State, C=US"
          base64 -w0 release.keystore > keystore.base64.txt
          printf '%s' "$PASSWORD" > password.txt

      - name: Upload keystore (download, then delete this artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            keystore.base64.txt
            password.txt
          retention-days: 1
